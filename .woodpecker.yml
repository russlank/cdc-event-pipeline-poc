# Woodpecker CI. Runs the same gates as .github/workflows/ci.yml: ci/dotnet-gates.sh,
# ci/integration-tests.sh, and ci/schema-compat.sh.

when:
  - event: [push, pull_request, manual]

# Woodpecker stops the services with SIGTERM when the steps are done. A JVM exits with 143
# (128 + SIGTERM) even after a clean shutdown, and Woodpecker marks the service failed;
# `failure: ignore` does not apply to services. So Kafka and Schema Registry run their image's
# start script under a shell that forwards SIGTERM, waits for the clean shutdown, and exits 0.
# ($$ is a literal $ for the shell: Woodpecker substitutes $NAME itself.)
services:
  # Single-node Kafka for the Schema Registry and the integration tests; settings as in
  # docker-compose.yml.
  kafka:
    image: apache/kafka:4.3.2
    entrypoint: ["/bin/bash", "-c", "/etc/kafka/docker/run & pid=$$!; trap 'kill -TERM $$pid; wait $$pid; exit 0' TERM; wait $$pid"]
    environment:
      CLUSTER_ID: QTEGCfpKUmmNZpjgXb67cA
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    entrypoint: ["/bin/bash", "-c", "/etc/confluent/docker/run & pid=$$!; trap 'kill -TERM $$pid; wait $$pid; exit 0' TERM; wait $$pid"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full_transitive
  postgres:
    image: postgres:18.4-alpine
    environment:
      # A throwaway CI database; the password only exists inside this pipeline.
      POSTGRES_PASSWORD: ci-only

steps:
  dotnet:
    # Same SDK as src/global.json; restores need nuget.org.
    image: mcr.microsoft.com/dotnet/sdk:10.0.402-noble
    commands:
      - bash ci/dotnet-gates.sh "$${CI_COMMIT_BRANCH}" "$${CI_REPO_URL}"

  integration:
    # No Docker daemon in the step: the tests use the services above instead of Testcontainers.
    image: mcr.microsoft.com/dotnet/sdk:10.0.402-noble
    environment:
      CDCPAY_IT_KAFKA: kafka:9092
      CDCPAY_IT_SCHEMA_REGISTRY: http://schema-registry:8081
      CDCPAY_IT_POSTGRES: Host=postgres;Username=postgres;Password=ci-only;Database=postgres
    commands:
      - bash ci/integration-tests.sh

  contracts:
    # The script waits up to two minutes for the registry service.
    image: curlimages/curl:8.22.0
    commands:
      - sh ci/schema-compat.sh http://schema-registry:8081
