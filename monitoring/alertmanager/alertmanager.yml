# Alertmanager: every alert goes to the local webhook sink, whose log shows it.
# For Slack as well, see alertmanager-slack.yml.
route:
  receiver: alert-sink
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:8080/alerts
        send_resolved: true
