# Prometheus: scrapes every metric source of the stack and evaluates the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # The .NET services push OTLP to the collector; their series keep the job label the collector
  # sets from service.name (for example CdcPay.EventTranslator).
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: connect
    static_configs:
      - targets: [connect:9404]

  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
