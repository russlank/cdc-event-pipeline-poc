# Local PoC stack. Every image is pinned; versions are listed in README.md.
# Secrets come from .env (copy .env.example). Ports bind to 127.0.0.1 only.
# The stack keeps no volumes: `docker compose down` resets all data.

name: cdc-pay


# Shared by the .NET services: JSON console logs with trace ids, and metrics and traces pushed
# over OTLP to the collector every 10 s.
x-dotnet-telemetry: &dotnet-telemetry
  Logging__Console__FormatterName: json
  Logging__Console__FormatterOptions__IncludeScopes: "true"
  Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffZ"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # CDC capture and cleanup jobs run in SQL Server Agent.
      MSSQL_AGENT_ENABLED: "true"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:1433:1433"
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -b -Q \"SELECT 1\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: creates HrCore, seeds it, and enables CDC. Safe to rerun.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -b
        -i /db/schema.sql -i /db/seed.sql -i /db/enable-cdc.sql
    restart: "no"

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: QTEGCfpKUmmNZpjgXb67cA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      # 127.0.0.1, not localhost: localhost resolves to ::1 first, and the port is bound to IPv4 only.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (kafka-init, Connect, Schema Registry).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Heap well below mem_limit; the default 1 GB heap left no room for the rest of the JVM.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:29092:29092"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot: creates the business and dead-letter topics. Safe to rerun.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        topics=/opt/kafka/bin/kafka-topics.sh
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic hr.employee-pay.v1 \
          --partitions 3 --replication-factor 1 --config retention.ms=-1
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic hr.dlq \
          --partitions 1 --replication-factor 1 --config retention.ms=-1
        $$topics --bootstrap-server kafka:9092 --describe --topic 'hr\..*'
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 768m
    healthcheck:
      # The image has neither curl nor wget; bash /dev/tcp makes the HTTP request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Debezium Connect plus the Prometheus JMX exporter agent (connect/Dockerfile), on :9404.
  connect:
    build:
      context: ./connect
    image: cdc-pay/connect:local
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Connector configs reference secrets as ${env:NAME}, so no secret is stored in Kafka
      # or in the connector JSON.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # The image defaults to -Xmx2G, more than the container limit: the kernel killed Connect (exit 137).
      HEAP_OPTS: -Xms256m -Xmx1g
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Restarts the Debezium task after the one known failure on Connect restarts (connect/watchdog.py).
  connect-watchdog:
    image: python:3.13.16-alpine3.23
    command: ["python", "-u", "/watchdog/watchdog.py"]
    volumes:
      - ./connect/watchdog.py:/watchdog/watchdog.py:ro
    mem_limit: 48m
    restart: unless-stopped

  # One-shot: registers (or updates) the Debezium connector. Safe to rerun.
  connect-init:
    image: curlimages/curl:8.22.0
    depends_on:
      connect:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./connect:/connect:ro
    entrypoint: ["/bin/sh", "/connect/register-connector.sh", "http://connect:8083", "/connect/hrcore-connector.json"]
    restart: "no"

  # One-shot: sets compatibility and registers every contract version in order. Safe to rerun.
  schemas-init:
    image: curlimages/curl:8.22.0
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts:ro
    entrypoint: ["/bin/sh", "/contracts/scripts/register-all.sh", "http://schema-registry:8081", "hr.employee-pay.v1-value", "/contracts", "FULL_TRANSITIVE"]
    restart: "no"

  event-translator:
    build:
      context: .
      dockerfile: src/CdcPay.EventTranslator/Dockerfile
      args:
        SOURCE_REVISION_ID: ${SOURCE_REVISION_ID:-}
        SOURCE_BRANCH: ${SOURCE_BRANCH:-}
        REPOSITORY_URL: ${REPOSITORY_URL:-}
    image: cdc-pay/event-translator:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schemas-init:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-telemetry
      Kafka__BootstrapServers: kafka:9092
      Kafka__SchemaRegistryUrl: http://schema-registry:8081
    ports:
      - "127.0.0.1:5101:8080"
    mem_limit: 512m
    restart: unless-stopped

  # Read model of the projector. Data lives in tmpfs, like the rest of the stack it is reset by
  # `docker compose down`. The init script adds the Query API's read-only login.
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: payhistory
      POSTGRES_DB: payhistory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYQUERY_DB_PASSWORD: ${PAYQUERY_DB_PASSWORD:?set PAYQUERY_DB_PASSWORD in .env}
    volumes:
      - ./db/readmodel/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payhistory -d payhistory"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pay-history-projector:
    build:
      context: .
      dockerfile: src/CdcPay.PayHistoryProjector/Dockerfile
      args:
        SOURCE_REVISION_ID: ${SOURCE_REVISION_ID:-}
        SOURCE_BRANCH: ${SOURCE_BRANCH:-}
        REPOSITORY_URL: ${REPOSITORY_URL:-}
    image: cdc-pay/pay-history-projector:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schemas-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *dotnet-telemetry
      Kafka__BootstrapServers: kafka:9092
      Kafka__SchemaRegistryUrl: http://schema-registry:8081
      ConnectionStrings__ReadModel: Host=postgres;Database=payhistory;Username=payhistory;Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5102:8080"
    mem_limit: 512m
    restart: unless-stopped

  pay-query-api:
    build:
      context: .
      dockerfile: src/CdcPay.PayQueryApi/Dockerfile
      args:
        SOURCE_REVISION_ID: ${SOURCE_REVISION_ID:-}
        SOURCE_BRANCH: ${SOURCE_BRANCH:-}
        REPOSITORY_URL: ${REPOSITORY_URL:-}
    image: cdc-pay/pay-query-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *dotnet-telemetry
      # Read-only login; ready once the projector has applied the schema.
      ConnectionStrings__ReadModel: Host=postgres;Database=payhistory;Username=pay_query;Password=${PAYQUERY_DB_PASSWORD}
    ports:
      - "127.0.0.1:5103:8080"
    mem_limit: 512m
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      connect:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cdc-pay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Monitoring: metrics, dashboard, alerts. ---

  # Receives OTLP from the .NET services and serves their metrics on :8889/metrics.
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"
    mem_limit: 192m
    restart: unless-stopped

  # Consumer-group lag and topic offsets (the DLQ count is the offset growth of hr.dlq).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - --kafka.server=kafka:9092
      - --topic.filter=^(hr|cdc)\..*
      - --group.filter=^cdcpay-.*
    mem_limit: 64m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    tmpfs:
      - /prometheus:uid=65534,gid=65534
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Routes alerts to the webhook sink (and to Slack with ALERTMANAGER_CONFIG=alertmanager-slack.yml).
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG:-alertmanager.yml}
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    tmpfs:
      - /alertmanager:uid=65534,gid=65534
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 96m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Prints every alert Alertmanager sends: `docker compose logs alert-sink`.
  alert-sink:
    image: python:3.13.16-alpine3.23
    command: ["python", "-u", "/sink/sink.py"]
    volumes:
      - ./monitoring/alert-sink:/sink:ro
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cdc-pay-pipeline.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
