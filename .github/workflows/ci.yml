name: ci

# Runs the same gates as .woodpecker.yml: ci/dotnet-gates.sh.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: src/global.json

      - name: .NET gates
        run: bash ci/dotnet-gates.sh "${{ github.ref_name }}" "${{ github.server_url }}/${{ github.repository }}"
