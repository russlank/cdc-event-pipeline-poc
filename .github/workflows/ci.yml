name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: src/global.json

      - name: Restore
        run: dotnet restore ./CdcPay.slnx

      - name: Build
        run: >-
          dotnet build ./CdcPay.slnx -c Release --no-restore
          -p:SourceBranch=${{ github.ref_name }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Test
        run: dotnet test ./CdcPay.slnx -c Release --no-build

      - name: Format
        run: dotnet format ./CdcPay.slnx --verify-no-changes
