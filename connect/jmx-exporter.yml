# Prometheus JMX exporter rules for Kafka Connect with Debezium. Only the beans below are read;
# JVM metrics come from the agent itself.
lowercaseOutputName: true
includeObjectNames:
  - "debezium.sql_server:*"
  - "kafka.connect:type=connector-metrics,*"
  - "kafka.connect:type=connector-task-metrics,*"
  - "kafka.connect:type=connect-worker-metrics,*"
rules:
  # Connector and task state as labelled gauges with value 1, for example status="running".
  - pattern: 'kafka.connect<type=connector-metrics, connector=([^>]+)><>status: ([a-z-]+)'
    name: kafka_connect_connector_status
    value: 1
    type: GAUGE
    labels:
      connector: "$1"
      status: "$2"
  - pattern: 'kafka.connect<type=connector-task-metrics, connector=([^,]+), task=([^>]+)><>status: ([a-z-]+)'
    name: kafka_connect_task_status
    value: 1
    type: GAUGE
    labels:
      connector: "$1"
      task: "$2"
      status: "$3"
  - pattern: 'kafka.connect<type=connect-worker-metrics, connector=([^>]+)><>([a-z-]+)'
    name: kafka_connect_worker_connector_$2
    type: GAUGE
    labels:
      connector: "$1"
  # Debezium snapshot and streaming metrics, for example MilliSecondsBehindSource.
  - pattern: 'debezium.([^:]+)<type=connector-metrics, server=([^,]+), task=([^,]+), context=([^,]+), database=([^>]+)><>([^:]+)'
    name: debezium_metrics_$6
    type: GAUGE
    labels:
      plugin: "$1"
      name: "$2"
      task: "$3"
      context: "$4"
      database: "$5"
  - pattern: 'debezium.([^:]+)<type=connector-metrics, server=([^,]+), task=([^,]+), context=([^>]+)><>([^:]+)'
    name: debezium_metrics_$5
    type: GAUGE
    labels:
      plugin: "$1"
      name: "$2"
      task: "$3"
      context: "$4"
